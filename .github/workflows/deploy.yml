name: Build & Deploy MERN App (Tagged Images)

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      IMAGE_TAG: ${{ github.sha }}
      APP_DIR: /home/ubuntu/mern-app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: sandeeptiwari0206
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Backend Image
        run: |
          docker build -t sandeeptiwari0206/mern-backend:${IMAGE_TAG} .
          docker push sandeeptiwari0206/mern-backend:${IMAGE_TAG}

      - name: Build & Push Frontend Image
        run: |
          docker build -t sandeeptiwari0206/mern-frontend:${IMAGE_TAG} ./frontend
          docker push sandeeptiwari0206/mern-frontend:${IMAGE_TAG}

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy on EC2
        run: |
          ssh -T ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << EOF
            set -e

            echo "🚀 Starting deployment"

            # Ensure app directory exists
            mkdir -p ${APP_DIR}
            cd ${APP_DIR}

            # Clone repo if .git does not exist, else pull latest changes
            if [ ! -d ".git" ]; then
              git clone https://github.com/sandeeptiwari0206/mernapp-githubaction-ecs-sonar.git .
            else
              git reset --hard
              git clean -fd
              git pull origin main
            fi

            # Export image tag for docker-compose
            export IMAGE_TAG=${IMAGE_TAG}

            echo "🛑 Stopping containers"
            docker compose down || true

            echo "📥 Pull Docker images with tag ${IMAGE_TAG}"
            docker compose pull

            echo "▶️ Starting containers"
            docker compose up -d

            echo "🧹 Cleaning old images"
            docker image prune -f

            echo "✅ Deployment completed successfully"
          EOF
