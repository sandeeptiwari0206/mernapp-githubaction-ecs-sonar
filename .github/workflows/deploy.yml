name: Build, Scan & Deploy MERN App (Tagged Images)

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      IMAGE_TAG: ${{ github.sha }}
      APP_DIR: /home/ubuntu/mern-app

    steps:
    # ---------------- Checkout ----------------
    - name: Checkout code
      uses: actions/checkout@v4

    # ---------------- Node Setup (for Sonar) ----------------
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18

    # ---------------- Sonar Cache Cleanup ----------------
    - name: Clear Sonar cache
      run: rm -rf ~/.sonar/cache

    # ---------------- Backend Sonar Scan ----------------
    - name: Install Backend Dependencies
      run: |
        cd backend
        npm ci

    - name: SonarQube Scan (Backend)
      run: |
        cd backend
        npx sonar-scanner@3.1.0 \
          -Dsonar.projectKey=mern-backend \
          -Dsonar.sources=. \
          -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
          -Dsonar.login=${{ secrets.SONAR_TOKEN }}

    # ---------------- Frontend Sonar Scan ----------------
    - name: Install Frontend Dependencies
      run: |
        cd frontend
        npm ci

    - name: SonarQube Scan (Frontend)
      run: |
        cd frontend
        npx sonar-scanner@3.1.0 \
          -Dsonar.projectKey=mern-frontend \
          -Dsonar.sources=. \
          -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
          -Dsonar.login=${{ secrets.SONAR_TOKEN }}

    # ---------------- Docker Login ----------------
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: sandeeptiwari0206
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # ---------------- Build & Push Images (UNCHANGED LOGIC) ----------------
    - name: Build & Push Backend Image
      run: |
        docker build -t sandeeptiwari0206/mern-backend:${IMAGE_TAG} .
        docker push sandeeptiwari0206/mern-backend:${IMAGE_TAG}

    - name: Build & Push Frontend Image
      run: |
        docker build -t sandeeptiwari0206/mern-frontend:${IMAGE_TAG} ./frontend
        docker push sandeeptiwari0206/mern-frontend:${IMAGE_TAG}

    # ---------------- Deploy to EC2 ----------------
    - name: Setup SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

    - name: Deploy on EC2
      run: |
        ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << EOF
          set -e

          echo "🚀 Starting deployment"

          mkdir -p ${APP_DIR}
          cd ${APP_DIR}

          if [ ! -d ".git" ]; then
            git clone https://github.com/sandeeptiwari0206/mernapp-githubaction-ecs-sonar.git .
          else
            git reset --hard
            git clean -fd
            git pull origin main
          fi

          export IMAGE_TAG=${IMAGE_TAG}

          echo "🛑 Stopping containers"
          docker compose down || true

          echo "📥 Pulling images"
          docker compose pull

          echo "▶️ Starting containers"
          docker compose up -d

          echo "🧹 Cleaning unused images"
          docker image prune -f

          echo "✅ Deployment completed successfully"
        EOF
