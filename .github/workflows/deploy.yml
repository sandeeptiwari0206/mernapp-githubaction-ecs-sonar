name: Build, Scan & Deploy MERN App (Tagged Images)

on:
  push:
    branches:
      - main

jobs:
  build-scan-deploy:
    runs-on: ubuntu-latest

    env:
      IMAGE_TAG: ${{ github.sha }}
      APP_DIR: /home/ubuntu/mern-app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ---------------- Sonar Scan for Backend ----------------
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies (Backend)
        run: |
          cd backend
          npm ci

      - name: SonarQube Scan (Backend)
        run: |
          cd backend
          npx sonar-scanner \
            -Dsonar.projectKey=mern-backend \
            -Dsonar.sources=. \
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}

      # ---------------- Sonar Scan for Frontend ----------------
      - name: Install dependencies (Frontend)
        run: |
          cd frontend
          npm ci

      - name: SonarQube Scan (Frontend)
        run: |
          cd frontend
          npx sonar-scanner \
            -Dsonar.projectKey=mern-frontend \
            -Dsonar.sources=. \
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}

      # ---------------- Docker Build & Push ----------------
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: sandeeptiwari0206
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Backend Image
        run: |
          docker build -t sandeeptiwari0206/mern-backend:${IMAGE_TAG} .
          docker push sandeeptiwari0206/mern-backend:${IMAGE_TAG}

      - name: Build & Push Frontend Image
        run: |
          docker build -t sandeeptiwari0206/mern-frontend:${IMAGE_TAG} ./frontend
          docker push sandeeptiwari0206/mern-frontend:${IMAGE_TAG}

      # ---------------- Deploy on EC2 ----------------
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy on EC2
        run: |
          ssh -T ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << EOF
            set -e
            echo "🚀 Starting deployment"
            mkdir -p ${APP_DIR}
            cd ${APP_DIR}
            if [ ! -d ".git" ]; then
              git clone https://github.com/sandeeptiwari0206/mernapp-githubaction-ecs-sonar.git .
            else
              git reset --hard
              git clean -fd
              git pull origin main
            fi
            export IMAGE_TAG=${IMAGE_TAG}
            docker compose down || true
            docker compose pull
            docker compose up -d
            docker image prune -f
            echo "✅ Deployment completed"
          EOF
