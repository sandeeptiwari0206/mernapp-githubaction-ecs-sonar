name: Build & Deploy MERN App (Tagged Images)

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: sandeeptiwari0206
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Backend Image
        run: |
          docker build -t sandeeptiwari0206/mern-backend:${IMAGE_TAG} .
          docker push sandeeptiwari0206/mern-backend:${IMAGE_TAG}

      - name: Build & Push Frontend Image
        run: |
          docker build -t sandeeptiwari0206/mern-frontend:${IMAGE_TAG} ./frontend
          docker push sandeeptiwari0206/mern-frontend:${IMAGE_TAG}

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy on EC2
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << EOF
            set -e
            cd /home/ubuntu/mern-app

            export IMAGE_TAG=${IMAGE_TAG}

            echo "🛑 Stopping containers"
            docker compose down

            echo "📥 Pulling images with tag ${IMAGE_TAG}"
            docker compose pull

            echo "▶️ Starting containers"
            docker compose up -d

            echo "✅ Deployment completed"
          EOF
