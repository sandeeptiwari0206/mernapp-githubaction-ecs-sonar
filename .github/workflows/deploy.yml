name: Build & Deploy MERN App (Tagged Images)

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      IMAGE_TAG: ${{ github.sha }}
      APP_DIR: /home/ubuntu/mern-app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: sandeeptiwari0206
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Backend Image
        run: |
          docker build -t sandeeptiwari0206/mern-backend:${IMAGE_TAG} .
          docker push sandeeptiwari0206/mern-backend:${IMAGE_TAG}

      - name: Build & Push Frontend Image
        run: |
          docker build -t sandeeptiwari0206/mern-frontend:${IMAGE_TAG} ./frontend
          docker push sandeeptiwari0206/mern-frontend:${IMAGE_TAG}

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy on EC2 (Fully Automated)
        run: |
          ssh -T ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << EOF
            set -e

            echo "🚀 Starting automated deployment"

            # 1️⃣ Install Docker if missing
            if ! command -v docker >/dev/null; then
              sudo apt update
              sudo apt install -y docker.io docker-compose-plugin
            fi

            # 2️⃣ Ensure app directory exists
            mkdir -p ${APP_DIR}
            cd ${APP_DIR}

            # 3️⃣ Create docker-compose.yml if missing
            if [ ! -f docker-compose.yml ]; then
              cat > docker-compose.yml << 'YAML'
              version: "3.8"
              services:
                backend:
                  image: sandeeptiwari0206/mern-backend:${IMAGE_TAG}
                  restart: always
                  ports:
                    - "5000:5000"

                frontend:
                  image: sandeeptiwari0206/mern-frontend:${IMAGE_TAG}
                  restart: always
                  ports:
                    - "80:80"
                  depends_on:
                    - backend
              YAML
            fi

            export IMAGE_TAG=${IMAGE_TAG}

            echo "🛑 Stopping containers"
            docker compose down || true

            echo "📥 Pulling images with tag ${IMAGE_TAG}"
            docker compose pull

            echo "▶️ Starting containers"
            docker compose up -d

            echo "🧹 Cleaning old images"
            docker image prune -f

            echo "✅ Deployment completed"
          EOF
